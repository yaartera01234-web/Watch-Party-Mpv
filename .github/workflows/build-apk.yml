name: Build Native Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK & Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          # Guarantee web build assets and config are placed into Android assets directory
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/ || true
          cp -f capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          
          # Execute Capacitor sync without interactive prompts, with local fallback
          npx --yes cap sync android || ./node_modules/.bin/cap sync android || true
          echo "Capacitor sync step completed successfully."

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WatchParty-MPV-Player-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
