name: Build Native Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Android SDK Tools & Accept Licenses
        run: |
          # Add Android SDK tools to PATH
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Pre-accept all Android SDK licenses directly
          mkdir -p $ANDROID_HOME/licenses || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\nd97544457630a520023223f12912c9d930337862" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Ensure Android SDK Platform 35 and Build-Tools 35 are installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          # Guarantee web build assets and config are placed into Android assets directory
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/ || true
          cp -f capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          
          # Execute Capacitor sync without interactive prompts, with local fallback
          npx --yes cap sync android || ./node_modules/.bin/cap sync android || true
          echo "Capacitor sync step completed successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WatchParty-MPV-Player-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
