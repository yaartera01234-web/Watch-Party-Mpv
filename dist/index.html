      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;

  <script>
    (function() {
      function submitChatIfActive() {
        var inp = document.getElementById('chat-message-input');
        var btn = document.getElementById('chat-send-btn');
        if (inp && (document.activeElement === inp || (inp.value && inp.value.trim().length > 0)) && btn) {
          btn.click();
          return true;
        }
        return false;
      }

      window.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13 || e.which === 13) {
          if (submitChatIfActive()) {
            e.preventDefault();
            e.stopPropagation();
          }
        }
      }, true);

      window.addEventListener('beforeinput', function(e) {
        if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
          if (submitChatIfActive()) {
            e.preventDefault();
            e.stopPropagation();
          }
        }
      }, true);
    })();
  </script>
